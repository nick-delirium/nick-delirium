name: GitHub-Profile-Summary-Cards

on:
  create:
  push:
    # site-only pushes don't need fresh cards (and would add a bot commit to every deploy)
    paths-ignore:
      - "site/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".gitignore"
      - ".github/workflows/pages.yml"
  schedule: # execute every 24 hours
    - cron: "* */24 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      - uses: actions/checkout@v2
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

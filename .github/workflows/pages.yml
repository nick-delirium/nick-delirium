name: Deploy site

# Builds site/ and publishes it to GitHub Pages (nick-delirium.github.io/nick-delirium/), and pings the
# root site repo to rebuild too. Only site changes trigger it, so the daily card commits don't redeploy.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "tools/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The root site (nick-delirium.github.io) builds from this repo too. Ping it so it redeploys now
  # instead of at its daily run. Needs a SITE_DISPATCH_TOKEN secret; without it this job is a no-op.
  mirror:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: Trigger nick-delirium.github.io deploy
        if: env.GH_TOKEN != ''
        run: gh api repos/${{ github.repository_owner }}/${{ github.repository_owner }}.github.io/dispatches -f event_type=site-updated

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
